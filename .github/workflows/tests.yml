name: Tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: payment_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d payment_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: sqlite:///./ci-app.db
      TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/payment_test
      RATE_LIMIT_HASH_SECRET: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -v
      - name: Run PostgreSQL limiter contention smoke benchmark
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/payment_test
        run: python -m scripts.benchmark_rate_limit --workers 8 --requests 100
      - name: Check frontend JavaScript syntax
        run: node --check frontend/app.js
